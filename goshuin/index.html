<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>酒蔵めぐり｜アプリのダウンロード</title>
<!--
  御酒印帳 公式サイト（柿本商事）の「御酒印帳公認酒蔵 MAP」枠のボタンの飛び先（2026-10-01・docs/御酒印帳_公式掲載.md）
  目的: 先方は Web 更新を頻繁にできないので、先方には「変わらない1本の URL」だけ渡し、
        飛び先（ストア URL・文言）の変更はこちらのページで吸収する。
  動き: 表示を trackLanding に s=goshuin で記録 → iPhone/iPad は App Store、Android は Google Play（referrer 付き）へ自動で移動。
        PC など判定できない端末は、このページのボタン（両ストア）と LP へのリンクを見せる。
  計測: scripts/landing-stats.js の bySource.goshuin（views / clicks）・byStore で確認。
-->
<style>
  :root { --indigo: #1f2a44; --red: #8B0000; --bg: #f7f3ee; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", Meiryo, sans-serif; background: var(--bg); color: var(--indigo); }
  .wrap { max-width: 480px; margin: 0 auto; padding: 48px 20px 40px; text-align: center; }
  .icon { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 6px 18px rgba(0,0,0,.15); }
  h1 { font-size: 24px; margin: 18px 0 6px; letter-spacing: .04em; }
  .sub { font-size: 14px; color: #5a4a3a; margin: 0 0 26px; line-height: 1.7; }
  .btn { display: block; margin: 0 auto 12px; max-width: 320px; padding: 14px 18px; border-radius: 14px; font-size: 16px; font-weight: 700; text-decoration: none; color: #fff; background: var(--indigo); }
  .btn.android { background: #2e6b3a; }
  .note { font-size: 12px; color: #7a6a5a; margin-top: 22px; line-height: 1.7; }
  .note a { color: var(--red); }
  .moving { font-size: 14px; color: #5a4a3a; margin-bottom: 18px; }
</style>
</head>
<body>
<div class="wrap">
  <img class="icon" src="../icon.png" alt="酒蔵めぐり">
  <h1>酒蔵めぐり</h1>
  <p class="sub">全国の酒蔵を地図で探せる無料アプリ</p>
  <p class="moving" id="moving" hidden>ストアへ移動しています…</p>
  <a class="btn ios" id="btn-ios" href="https://apps.apple.com/jp/app/id6763684964">App Store でダウンロード</a>
  <a class="btn android" id="btn-android" href="https://play.google.com/store/apps/details?id=com.munetoshi.sakaguraapp&referrer=utm_source%3Dgoshuin%26utm_medium%3Dreferral">Google Play で手に入れる</a>
  <p class="note">自動で移動しない場合は上のボタンを押してください。<br>アプリの詳しい紹介は <a href="../">酒蔵めぐり公式ページ</a> へ。</p>
</div>
<script>
(function () {
  var EP = 'https://asia-northeast1-sakagura-app.cloudfunctions.net/trackLanding';
  var SRC = 'goshuin';
  var IOS = 'https://apps.apple.com/jp/app/id6763684964';
  var ANDROID = 'https://play.google.com/store/apps/details?id=com.munetoshi.sakaguraapp&referrer=utm_source%3Dgoshuin%26utm_medium%3Dreferral';
  var beacon = function (params) {
    var url = EP + '?' + params.join('&');
    try { if (navigator.sendBeacon) { navigator.sendBeacon(url); return; } } catch (e) {}
    var img = new Image(); img.src = url;
  };
  beacon(['e=view', 's=' + SRC]);

  var ua = navigator.userAgent || '';
  var isIOS = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/.test(ua);
  var store = isIOS ? 'ios' : isAndroid ? 'android' : '';

  // 手動のボタンも計測
  document.getElementById('btn-ios').addEventListener('click', function () { beacon(['e=click', 's=' + SRC, 'store=ios']); });
  document.getElementById('btn-android').addEventListener('click', function () { beacon(['e=click', 's=' + SRC, 'store=android']); });

  if (store) {
    document.getElementById('moving').hidden = false;
    beacon(['e=click', 's=' + SRC, 'store=' + store]);
    setTimeout(function () { location.replace(store === 'ios' ? IOS : ANDROID); }, 350);
  }
})();
</script>
</body>
</html>
